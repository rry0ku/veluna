name: Bug Report
description: Report an issue or unexpected behavior in Veluna
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue. Please fill out the form below with as much detail as possible to help us reproduce and resolve the problem.
  - type: dropdown
    id: version
    attributes:
      label: Veluna Version
      description: What version of Veluna are you running?
      options:
        - v0.1.6
        - v0.1.5
        - Built from source (main branch)
        - Other (specify in description)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Select the operating system on which you encountered the issue.
      options:
        - Linux (Arch / Manjaro / EndeavourOS)
        - Linux (Debian / Ubuntu / Linux Mint)
        - Linux (Fedora / RHEL)
        - Linux (Other distribution)
        - Windows 11 (64-bit)
        - Windows 10 (64-bit)
        - Other (specify below)
    validations:
      required: true
  - type: input
    id: os_details
    attributes:
      label: OS / Desktop Environment Details
      description: If running Linux, specify your distribution version, desktop environment, and display server (e.g. Arch Linux, GNOME 47, Wayland or X11).
      placeholder: "e.g. Arch Linux, KDE Plasma 6, Wayland"
    validations:
      required: false
  - type: dropdown
    id: installation_method
    attributes:
      label: Installation Method
      description: How did you install Veluna?
      options:
        - Native Arch package (PKGBUILD / makepkg / pkg.tar.zst)
        - Debian package (.deb)
        - RPM package (.rpm)
        - Windows binary (.zip / .exe)
        - Built from source (cargo build --release)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem in detail.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
      placeholder: What occurred instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Terminal Output
      description: Paste any relevant terminal logs or console error outputs here.
      placeholder: Paste error messages, terminal logs, or browser console outputs.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have verified that this issue has not already been reported.
          required: true
        - label: I have provided all relevant details, including OS and application version.
          required: true
