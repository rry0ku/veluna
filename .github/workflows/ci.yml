name: 'CI Check'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-linux:
    name: 'Linux check'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            rpm \
            zstd \
            libarchive-tools

      - name: Build Frontend
        run: |
          cd ui
          npm ci
          npm run build

      - name: Setup FFmpeg sidecar binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/setup-ffmpeg.mjs linux-x64

      - name: Check Rust Backend & Tests
        run: |
          cargo check --workspace
          cargo test --workspace

  check-windows:
    name: 'Windows check'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup MSVC developer tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download and setup Windows libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ "User-Agent" = "veluna-ci" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d+.*\.7z$' } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-.*\.7z$' -and $_.name -notmatch 'v3' } | Select-Object -First 1
          }
          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev -y

          $names = dumpbin /exports mpv-dev\libmpv-2.dll |
            Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          @("EXPORTS") + ($names | ForEach-Object { "    $_" }) | Set-Content mpv-dev\mpv.def -Encoding ascii
          lib /def:mpv-dev\mpv.def /name:libmpv-2.dll /out:mpv-dev\mpv.lib /machine:x64
          Copy-Item mpv-dev\libmpv-2.dll src-tauri\libmpv-2.dll -Force

      - name: Build Frontend
        shell: pwsh
        run: |
          cd ui
          npm ci
          npm run build
          cd ..

      - name: Setup FFmpeg sidecar binary
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/setup-ffmpeg.mjs win32-x64

      - name: Check Rust Backend
        shell: pwsh
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}\mpv-dev -C link-arg=/NODEFAULTLIB:libcmt.lib
        run: |
          cargo check --workspace

  check-macos:
    name: 'macOS check'
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install macOS dependencies
        run: |
          brew install mpv

      - name: Build Frontend
        run: |
          cd ui
          npm ci
          npm run build

      - name: Setup FFmpeg sidecar binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/setup-ffmpeg.mjs darwin-arm64

      - name: Check Rust Backend
        run: |
          export LIBRARY_PATH="$(brew --prefix)/lib:$LIBRARY_PATH"
          cargo check --workspace
