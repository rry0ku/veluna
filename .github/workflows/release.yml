name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.7)'
        required: true
        default: 'v0.1.7'

permissions:
  contents: write

jobs:
  release-linux:
    name: 'Linux packages'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            rpm \
            zstd \
            libarchive-tools \
            curl \
            jq

      - name: Build Frontend
        run: |
          cd ui
          npm ci
          npm run build

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Setup FFmpeg sidecar binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/setup-ffmpeg.mjs linux-x64

      - name: Build Tauri Bundles (.deb, .rpm, .AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build

      - name: Patch AppImage for multi-distro portability
        run: |
          chmod +x ./scripts/fix-appdir-tls.sh
          ./scripts/fix-appdir-tls.sh target/release/bundle/appimage || true

      - name: Build Arch Linux package (.pkg.tar.zst)
        run: |
          chmod +x ./scripts/build-arch-pkg.sh
          ./scripts/build-arch-pkg.sh "${{ github.ref_name || inputs.tag }}"

      - name: Stage Linux packages
        run: |
          mkdir -p linux-dist
          cp target/release/bundle/appimage/*.AppImage* linux-dist/ 2>/dev/null || true
          cp target/release/bundle/appimage/*.tar.gz* linux-dist/ 2>/dev/null || true
          cp target/release/bundle/appimage/*.sig linux-dist/ 2>/dev/null || true
          cp target/release/bundle/deb/*.deb linux-dist/ 2>/dev/null || true
          cp target/release/bundle/rpm/*.rpm linux-dist/ 2>/dev/null || true
          cp veluna-*.pkg.tar.zst linux-dist/ 2>/dev/null || true
          ls -la linux-dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: linux-dist/*

  release-windows:
    name: 'Windows packages'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup MSVC developer tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download and setup Windows libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ "User-Agent" = "veluna-ci" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d+.*\.7z$' } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-.*\.7z$' -and $_.name -notmatch 'v3' } | Select-Object -First 1
          }
          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev -y

          $names = dumpbin /exports mpv-dev\libmpv-2.dll |
            Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          @("EXPORTS") + ($names | ForEach-Object { "    $_" }) | Set-Content mpv-dev\mpv.def -Encoding ascii
          lib /def:mpv-dev\mpv.def /name:libmpv-2.dll /out:mpv-dev\mpv.lib /machine:x64
          Copy-Item mpv-dev\libmpv-2.dll src-tauri\libmpv-2.dll -Force

      - name: Build Frontend
        shell: pwsh
        run: |
          cd ui
          npm ci
          npm run build
          cd ..

      - name: Install Tauri CLI
        shell: pwsh
        run: npm install -g @tauri-apps/cli

      - name: Setup FFmpeg sidecar binary
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/setup-ffmpeg.mjs win32-x64

      - name: Build Tauri Bundles (.exe NSIS and .msi)
        shell: pwsh
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}\mpv-dev
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          tauri build --config src-tauri/tauri.windows.conf.json

      - name: Stage Windows packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-dist
          Get-ChildItem -Path target/release/bundle/nsis/*.exe* -ErrorAction SilentlyContinue | Copy-Item -Destination windows-dist
          Get-ChildItem -Path target/release/bundle/nsis/*.zip* -ErrorAction SilentlyContinue | Copy-Item -Destination windows-dist
          Get-ChildItem -Path target/release/bundle/nsis/*.sig -ErrorAction SilentlyContinue | Copy-Item -Destination windows-dist
          Get-ChildItem -Path target/release/bundle/msi/*.msi* -ErrorAction SilentlyContinue | Copy-Item -Destination windows-dist
          Get-ChildItem -Path windows-dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: windows-dist/*

  release-macos:
    name: 'macOS packages'
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install macOS dependencies
        run: |
          brew install mpv dylibbundler create-dmg

      - name: Build Frontend
        run: |
          cd ui
          npm ci
          npm run build

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Setup FFmpeg sidecar binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/setup-ffmpeg.mjs darwin-arm64

      - name: Build Tauri App Bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export LIBRARY_PATH="$(brew --prefix)/lib:$LIBRARY_PATH"
          tauri build --config src-tauri/tauri.macos.conf.json --bundles app

      - name: Bundle dynamic libraries & ad-hoc codesign
        run: |
          APP="target/release/bundle/macos/veluna.app"
          BIN="$APP/Contents/MacOS/veluna"
          dylibbundler -cd -of -b -x "$BIN" -d "$APP/Contents/Frameworks" -p "@executable_path/../Frameworks" -s "$(brew --prefix)/lib"
          install_name_tool -delete_rpath '@executable_path/../Frameworks/' "$APP/Contents/Frameworks/libmpv.2.dylib" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Create DMG package
        run: |
          APP="target/release/bundle/macos/veluna.app"
          mkdir -p target/release/bundle/dmg
          VERSION="${{ github.ref_name || inputs.tag }}"
          VERSION="${VERSION#v}"
          DMG_PATH="target/release/bundle/dmg/veluna_${VERSION}_aarch64.dmg"

          create-dmg \
            --volname "Veluna" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "veluna.app" 175 190 \
            --hide-extension "veluna.app" \
            --app-drop-link 425 190 \
            "$DMG_PATH" \
            "$APP" || hdiutil create -volname "Veluna" -srcfolder "$APP" -ov -format UDZO "$DMG_PATH"

      - name: Stage macOS packages
        run: |
          mkdir -p macos-dist
          cp target/release/bundle/dmg/*.dmg macos-dist/ 2>/dev/null || true
          cp target/release/bundle/macos/*.app.tar.gz* macos-dist/ 2>/dev/null || true
          ls -la macos-dist/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: macos-dist/*

  publish:
    name: 'Publish release'
    needs: [release-linux, release-windows, release-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist

      - name: Consolidate distribution files
        run: |
          mkdir -p dist
          find all-dist -type f -exec cp {} dist/ \;
          echo "=== Release packages ==="
          ls -lh dist/

      - name: Determine tag name
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate latest.json updater manifest
        run: |
          node scripts/generate-latest-json.mjs "${{ steps.vars.outputs.tag }}" dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Veluna ${{ steps.vars.outputs.tag }}
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
