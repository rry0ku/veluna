name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-build:
    name: 'Linux build'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libsqlite3-dev \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            libvulkan-dev \
            libdbus-1-dev \
            zstd \
            libarchive-tools

      - name: Install packaging tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release -p veluna

      - name: Build .deb package
        run: cargo deb -p veluna --no-build

      - name: Build .rpm package
        run: |
          strip target/release/veluna
          cargo generate-rpm -p crates/veluna

      - name: Build .pkg.tar.zst (Arch Linux)
        run: |
          chmod +x ./scripts/build-arch-pkg.sh
          ./scripts/build-arch-pkg.sh "${{ github.ref_name }}"

      - name: Build AppImage
        run: |
          chmod +x ./scripts/build-appimage.sh
          ./scripts/build-appimage.sh "${{ github.ref_name }}"

      - name: Create GitHub Release and upload Linux packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${VERSION}" = "main" ] || [ "${VERSION}" = "master" ] || [ -z "${VERSION}" ]; then
            VERSION="v0.1.6"
          fi
          VERSION_NUM="${VERSION#v}"

          # Ensure exact naming conventions
          DEB_FILE=$(find target/debian -name "veluna_*.deb" | head -n 1)
          cp "${DEB_FILE}" "veluna_${VERSION_NUM}_amd64.deb"

          RPM_FILE=$(find target/generate-rpm -name "veluna-*.rpm" | head -n 1)
          cp "${RPM_FILE}" "veluna-${VERSION_NUM}-1.x86_64.rpm"

          gh release create "${VERSION}" \
            --title "Veluna ${VERSION}" \
            --notes "See the assets below to download Veluna for your platform." \
            --draft=false \
            --prerelease=false \
            || true
          gh release upload "${VERSION}" \
            "veluna_${VERSION_NUM}_amd64.deb" \
            "veluna-${VERSION_NUM}-1.x86_64.rpm" \
            "veluna-${VERSION_NUM}-1-x86_64.pkg.tar.zst" \
            "veluna-${VERSION_NUM}-x86_64.AppImage" \
            --clobber

  windows-build:
    name: 'Windows build'
    runs-on: windows-latest
    needs: linux-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p veluna

      - name: Package Windows executable
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -eq "main" -or $ref -eq "master" -or [string]::IsNullOrWhiteSpace($ref)) {
            $version = "0.1.6"
          } else {
            $version = $ref.TrimStart('v')
          }
          Copy-Item "target/release/veluna.exe" -Destination "veluna_${version}_x64-setup.exe"

      - name: Upload Windows executable to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -eq "main" -or $ref -eq "master" -or [string]::IsNullOrWhiteSpace($ref)) {
            $version = "v0.1.6"
          } else {
            $version = $ref
          }
          $exe = Get-ChildItem "veluna_*_x64-setup.exe" | Select-Object -First 1
          gh release upload $version $exe.Name --clobber
