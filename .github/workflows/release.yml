name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-build:
    name: 'Linux build'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libdbus-1-dev \
            libsqlite3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            zstd \
            libarchive-tools

      - name: Install packaging tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release -p veluna

      - name: Build .deb package
        run: cargo deb -p veluna --no-build

      - name: Build .rpm package
        run: |
          strip target/release/veluna
          cargo generate-rpm -p crates/veluna

      - name: Build .pkg.tar.zst (Arch Linux)
        run: |
          chmod +x ./scripts/build-arch-pkg.sh
          ./scripts/build-arch-pkg.sh "${{ github.ref_name }}"

      - name: Create GitHub Release and upload Linux packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release create "${VERSION}" \
            --title "Veluna ${VERSION}" \
            --notes "See the assets below to download Veluna for your platform." \
            --draft=false \
            --prerelease=false \
            || true
          gh release upload "${VERSION}" \
            target/debian/veluna_*.deb \
            target/generate-rpm/veluna-*.rpm \
            veluna-*.pkg.tar.zst \
            --clobber

  windows-build:
    name: 'Windows build'
    runs-on: windows-latest
    needs: linux-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p veluna

      - name: Package Windows binary
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive `
            -Path "target/release/veluna.exe" `
            -DestinationPath "veluna-${version}-windows-x86_64.zip" `
            -Force

      - name: Upload Windows package to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zip = Get-ChildItem "veluna-*-windows-x86_64.zip" | Select-Object -First 1
          gh release upload $version $zip.Name --clobber
